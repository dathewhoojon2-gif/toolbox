<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Length Converter - ToolBox</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>ToolBox</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="../index.html">Tools</a>

            <a href="about.html">About</a>

            <button id="themeToggle">🌙</button>

        </nav>

    </header>


    <!-- Main -->

    <main>

        <section class="calculator">

            <h2>📏 Length Converter</h2>

            <p>
                Convert between different units of length.
            </p>


            <!-- Value -->

            <div class="input-group">

                <label for="lengthValue">
                    Enter Value
                </label>

                <input
                    type="number"
                    id="lengthValue"
                    placeholder="Enter length"
                    min="0"
                    step="any">

            </div>


            <!-- From -->

            <div class="input-group">

                <label for="fromLengthUnit">
                    From
                </label>

                <select id="fromLengthUnit">

                    <option value="meter">
                        Meter (m)
                    </option>

                    <option value="kilometer">
                        Kilometer (km)
                    </option>

                    <option value="centimeter">
                        Centimeter (cm)
                    </option>

                    <option value="millimeter">
                        Millimeter (mm)
                    </option>

                    <option value="mile">
                        Mile (mi)
                    </option>

                    <option value="yard">
                        Yard (yd)
                    </option>

                    <option value="foot">
                        Foot (ft)
                    </option>

                    <option value="inch">
                        Inch (in)
                    </option>

                    <option value="nauticalMile">
                        Nautical Mile (nmi)
                    </option>

                </select>

            </div>


            <!-- To -->

            <div class="input-group">

                <label for="toLengthUnit">
                    To
                </label>

                <select id="toLengthUnit">

                    <option value="foot">
                        Foot (ft)
                    </option>

                    <option value="meter">
                        Meter (m)
                    </option>

                    <option value="kilometer">
                        Kilometer (km)
                    </option>

                    <option value="centimeter">
                        Centimeter (cm)
                    </option>

                    <option value="millimeter">
                        Millimeter (mm)
                    </option>

                    <option value="mile">
                        Mile (mi)
                    </option>

                    <option value="yard">
                        Yard (yd)
                    </option>

                    <option value="inch">
                        Inch (in)
                    </option>

                    <option value="nauticalMile">
                        Nautical Mile (nmi)
                    </option>

                </select>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button id="convertLengthBtn">
                    Convert
                </button>

                <button id="clearLengthBtn">
                    Clear
                </button>

            </div>


            <!-- Result -->

            <div
                id="lengthResult"
                class="percentage-result-card">

                <p class="percentage-result-title">
                    CONVERTED LENGTH
                </p>

                <div id="lengthResultValue">
                    --
                </div>

                <p id="lengthResultDetails">
                    Enter a length value to convert
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 ToolBox.
            All rights reserved.
        </p>

    </footer>


    <script src="../js/length.js"></script>

    <script src="../js/theme.js"></script>

</body>

</html>
