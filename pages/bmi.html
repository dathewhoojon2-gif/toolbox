<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">

    <title>BMI Calculator - ToolBox</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>ToolBox</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="../index.html">Tools</a>

            <a href="about.html">About</a>

            <button id="themeToggle">🌙</button>

        </nav>

    </header>

    <!-- BMI Calculator-->

    <main>

        <section class="calculator">

            <h2>BMI Calculator</h2>

            <p>
                Calculate your Body Mass Index using your height and weight.
            </p>

            <div class="input-group">

                <label for="height">Height(cm)</label>

                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height">

            </div>

            <div class="input-group">

                <label for="weight">Weight(kg)</label>

                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight">

            </div>

            <div class="button-group">

                <button id="calculateBtn">
                    Calculate BMI
                </button>

                <button id="clearBtn">
                    Clear
                </button>

            </div>

            <div id="result" class="result-card">

                <p class="result-title">Your BMI</p>

                <div id="bmiValue">--</div>

                <div id="bmiCategory">Enter your details</div>
                
            </div>

            <div class="bmi-reference">

                <h3>BMI Reference</h3>

                <div class="bmi-scale">

                    <div class="scale-item underweight-scale">
                        <span>Underweight</span>
                        <strong>&lt; 18.5</strong>
                    </div>

                    <div class="scale-item normal-scale">
                        <span>Normal</span>
                        <strong>18.5 - 24.9</strong>
                    </div>

                    <div class="scale-item overweight-scale">
                        <span>Overweight</span>
                        <strong>25 - 29.9</strong>
                    </div>

                    <div class="scale-item obesity-scale">
                        <span>Obesity</span>
                        <strong>30+</strong>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy 2026 ToolBox. All rights reserved.
        </p>

    </footer>

    <script src="../js/bmi.js"></script>

    <script src="../js/theme.js"></script>



</body>

</html>
