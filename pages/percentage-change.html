<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>Percentage Increase / Decrease - Toolbox</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>Toolbox</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="percentage.html">Percentage</a>

            <a href="about.html">About</a>

           <button id="themeToggle">🌙</button>

        </nav>

    </header>

    <!-- Calculator -->

    <main>

        <section class="calculator">

            <h2>Percentage Increase / Decrease</h2>

            <P>
                Calculate the percentage change between two values.
            </P>

            <!-- Original Value -->

            <div class="input-group">

                <label for="originalValue">
                    Original Value
                </label>

                <input
                    type="number"
                    id="originalValue"
                    placeholder="Enter original value">

            </div>

            <!-- New Value -->

            <div class="input-group">

                <label for="newValue">
                    New Value
                </label>

                <input
                    type="number"
                    id="newValue"
                    placeholder="Enter new value">

            </div>

            <div class="button-group">

                <button id="calculateChangeBtn">
                    Calculate
                </button>

                <button id="clearChangeBtn">
                    Clear
                </button>

            </div>

            <!-- Result -->

            <div id="changeResult" class="percentage-result-card">

                <p class="percentage-result-title">
                    Result
                </p>

                <div id="changeResultValue">
                    --
                </div>

                <p id="changeResultDetails">
                    Enter values and calculate
                </p>

            </div><br><br>

            <a href="percentage.html" class="back-link">
                ←  Back
            </a>


        </section>

    </main>

     <footer>

        <p>
            &copy; 2026 Toolbox.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/percentage-change.js"></script>

    <script src="../js/theme.js"></script>



</body>

</html>
