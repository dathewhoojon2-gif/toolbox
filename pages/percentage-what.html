<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>What Percentage Is X of Y? - Toolbox</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>Toolbox</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="percentage.html">Percentage</a>

            <a href="about.html">About</a>

            <button id="themeToggle">🌙</button>

        </nav>

    </header>

    <!-- Calculator -->

    <main>

        <section class="calculator">

            <h2>What Percentage Is X of Y?</h2>

            <p>
                Find out what percentage one number is of another number.
            </p>

            <div class="input-group">

                <label for="valueX">
                    X (Value)
                </label>

                <input
                    type="number"
                    id="valueX"
                    placeholder="Enter value">

            </div>

            <div class="input-group">

                <label for="valueY">
                    Y (Total)
                </label>

                <input
                    type="number"
                    id="valueY"
                    placeholder="Enter total">

            </div>

            <div class="button-group">

                <button id="calculateWhatPercentageBtn">
                    Calculate
                </button>

                <button id="clearWhatPercentageBtn">
                    Clear
                </button>

            </div>

            <!-- Result -->

            <div id="whatPercentageResult" class="percentage-result-card">

                 <p class="percentage-result-title">
                Result
            </p> 

            <div id="whatPercentageValue">
                --
            </div>

            <p id="whatPercentageDetails">
                Enter values and calculate
            </p>
        
            </div><br><br>

            <a href="percentage.html" class="back-link">
                ←  Back
            </a>

          
        </section>

    </main>

     <footer>

        <p>
            &copy; 2026 Toolbox.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/percentage-what.js"></script>

    <script src="../js/theme.js"></script>



</body>

</html>
