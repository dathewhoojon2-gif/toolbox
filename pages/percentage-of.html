<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>Percentage Calculator Toolbox</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>Toolbox</h1>

        <nav>

            <a href="../index.html">Home</a>

            <a href="percentage.html">Percentage</a>

            <a href="about.html">About</a>

            <button id="themeToggle">🌙</button>

        </nav>

    </header>

    <!-- Calculation -->

    <main>

        <section class="calculator">

            <h2>Percentage of a Number</h2>

            <p>
                Calculate what X% of Y is.
            </p>

            <div class="input-group">

                <label for="percentage">
                    Percentage (%)
                </label>

                <input
                    type="number"
                    id="percentage"
                    placeholder="Enter percentage">
            </div>

            <div class="input-group">

                <label for="number">
                    Number
                </label>

                <input
                    type="number"
                    id="number"
                    placeholder="Enter number">
            </div>

            <div class="button-group">

                <button id="calculatePercentageBtn">
                      Calculate
            </button>

            <button id="clearPercentageBtn">
                Clear
            </button>

            </div>

            <!-- Result -->

            <div id="percentageResult" class="percentage-result-card">

                <p class="percentage-result-title">
                    Result
                </p>

                <div id="percentageResultValue">
                    --
                </div>

                <p id="percentageResultDetails">
                    Enter values and calculate
                </p>

            </div><br><br>

             <a href="percentage.html" class="back-link">
                ←  Back
            </a>

        </section>

    </main>

     <footer>

        <p>
            &copy; 2026 Toolbox.
            All rights reserved.
        </p>

    </footer>

    <script src="../js/percentage-of.js"></script>

    <script src="../js/theme.js"></script>



</body>

</html>
